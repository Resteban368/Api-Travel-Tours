<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
  /* ── Helpers ─────────────────────────────────────────── */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const num = n => Number(n) || 0;
  const COP = n => new Intl.NumberFormat('es-CO', { style:'currency', currency:'COP', maximumFractionDigits:0 }).format(num(n));
  const MO  = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const fd  = s => { if (!s) return ''; const [y,m,d] = String(s).substring(0,10).split('-'); return `${+d} ${MO[+m-1]} ${y}`; };
  const code = s => s?.match(/\(([A-Z]{3})\)/)?.[1] || String(s || '').substring(0,3).toUpperCase() || '???';
  const city = s => String(s || '').split('(')[0].trim();
  // "11:AM" → "11:00 AM", "13:PM" → "13:00", "14:30" → "14:30"
  const hora = s => {
    const m = String(s || '').trim().match(/^(\d{1,2})(?::(\d{2}))?\s*:?\s*(AM|PM)?$/i);
    if (!m) return esc(s);
    const h = +m[1], min = m[2] || '00', ap = (m[3] || '').toUpperCase();
    return h > 12 || !ap ? `${h}:${min}` : `${h}:${min} ${ap}`;
  };
  const iniciales = s => String(s || '').trim().split(/\s+/).slice(0,2).map(p => p[0]).join('').toUpperCase();
  const icon = (name, cls = '') => `<i data-lucide="${name}" class="${cls}"></i>`;
  const renderIcons = () => window.lucide?.createIcons();

  // Ícono según el texto del ítem (incluye / no incluye / amenidades)
  const ICON_RULES = [
    [/tiquete|vuelo|a[eé]re|avi[oó]n/i, 'plane'],
    [/traslado|transfer|transporte|bus/i, 'car'],
    [/desayuno buffet|buffet/i, 'croissant'],
    [/desayuno|caf[eé]/i, 'coffee'],
    [/comida|alimenta|almuerzo|cena|restaurante/i, 'utensils'],
    [/todo incluido|all inclusive/i, 'sparkles'],
    [/snack|merienda/i, 'cookie'],
    [/habitaci[oó]n|room/i, 'bell'],
    [/zona|com[uú]n|piscina|gimnasio|spa/i, 'users'],
    [/seguro|asistencia|m[eé]dic/i, 'shield-check'],
    [/hotel|aloja|hospeda|noche/i, 'hotel'],
    [/entrada|museo|pir[aá]mide|parque|ticket|boleta/i, 'landmark'],
    [/tour|excursi|actividad|visita/i, 'ticket'],
    [/impuesto|tasa|cargo/i, 'receipt'],
    [/wifi|internet/i, 'wifi'],
  ];
  const iconFor = (txt, fallback) => (ICON_RULES.find(([re]) => re.test(txt)) || [null, fallback])[1];

  const SLIDE_DURATION = 5000;
  const token = window.location.pathname.split('/').filter(Boolean).pop();
  const REF = String(token || '').substring(0,8).toUpperCase();

  /* ── Fetch ───────────────────────────────────────────── */
  async function load() {
    try {
      const [rCot, rEmp] = await Promise.all([
        fetch(`/v1/p/${token}`),
        fetch(`/v1/info-empresa/publica`),
      ]);
      if (!rCot.ok) throw 0;
      const data = await rCot.json();
      const empArr = rEmp.ok ? await rEmp.json() : [];
      const empresa = Array.isArray(empArr) ? empArr[0] : empArr;
      render(data, empresa || {});

      // Registrar vista una sola vez por sesión de navegador
      if (!data._preview && !sessionStorage.getItem(`vista_${token}`)) {
        sessionStorage.setItem(`vista_${token}`, '1');
        fetch(`/v1/p/${token}/vista`, { method: 'POST' }).catch(() => {});
      }
    } catch {
      document.getElementById('app').innerHTML = `
        ${headerHtml(null)}
        <div class="flex-grow flex items-center justify-center px-4 py-24">
          <div class="max-w-md text-center bg-white rounded-2xl p-10 shadow-soft border border-slate-200/90">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-cyan-50 text-brand-ocean flex items-center justify-center text-2xl mb-5">${icon('plane')}</div>
            <h2 class="text-xl font-bold text-slate-900 tracking-tight">Cotización no encontrada</h2>
            <p class="text-sm text-slate-500 mt-2">El enlace puede haber expirado o ser incorrecto. Comunícate con tu asesor de Travel Club.</p>
          </div>
        </div>`;
      renderIcons();
    }
  }

  /* ── Header ──────────────────────────────────────────── */
  const LOGO = '/logo-travel-club/logo-256.png';
  const brandBadge = (extra = '') => `
    <div class="bg-white pl-2 pr-4 py-1.5 rounded-2xl shadow-md flex items-center gap-2.5 border border-white/30 ${extra}">
      <img alt="Travel Club Agencia de Viajes" class="w-10 h-10 object-contain rounded-full shadow-sm" src="${LOGO}">
      <div class="leading-none text-left">
        <span class="block text-[10px] font-bold tracking-tight text-slate-500 uppercase">Agencia de Viajes</span>
        <span class="block text-sm font-extrabold tracking-wider text-brand-navy">TRAVEL<span class="text-brand-cyan ml-0.5">CLUB</span></span>
      </div>
    </div>`;

  function headerHtml(d) {
    return `
      <header class="bg-brand-navy/95 border-b border-white/10 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
          <div class="flex items-center gap-3">
            ${brandBadge()}
            ${d ? `<span class="hidden sm:inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-300 bg-emerald-950/70 px-3 py-1 rounded-full border border-emerald-600/50 shadow-sm">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              ${d._preview ? 'Vista previa' : 'Cotización Activa'}
            </span>` : ''}
          </div>
          ${d ? `<div class="flex items-center gap-3 sm:gap-4">
            <div class="text-right hidden md:block">
              <p class="text-[11px] text-cyan-200/80 uppercase tracking-wider font-semibold">Código de Expediente</p>
              <p class="text-sm font-bold text-white font-mono tracking-wide">REF. ${REF}</p>
            </div>
            <div class="h-8 w-px bg-white/15 hidden md:block"></div>
            <a href="#total-sidebar" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-brand-ocean to-brand-navy hover:brightness-110 text-white text-xs font-bold uppercase tracking-wider transition border border-cyan-400/30 shadow-sm">
              ${icon('calculator', 'w-4 h-4 text-brand-gold')}
              <span id="hdr-total">—</span>
            </a>
          </div>` : ''}
        </div>
      </header>`;
  }

  /* ── Incluye / No incluye ────────────────────────────── */
  function incluyeHtml(items) {
    if (!items.length) return '';
    return `
      <div class="bg-white rounded-2xl p-6 sm:p-7 shadow-soft border border-slate-200/90 fade-up">
        <div class="flex items-center justify-between pb-5 border-b border-slate-100">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-cyan-50 text-brand-ocean flex items-center justify-center text-xl">${icon('check', 'stroke-[2.5]')}</div>
            <div>
              <h2 class="text-lg font-bold text-slate-900 tracking-tight">Incluye en tu paquete</h2>
              <p class="text-xs text-slate-500">Servicios contratados confirmados</p>
            </div>
          </div>
          <span class="text-xs font-semibold px-2.5 py-1 bg-cyan-50 text-brand-ocean border border-cyan-200 rounded-full">${items.length} item${items.length > 1 ? 's' : ''}</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-5">
          ${items.map(t => `
          <div class="flex items-center gap-3 p-3.5 rounded-xl bg-slate-50/80 border border-slate-100 hover:border-cyan-300 transition">
            <div class="w-8 h-8 rounded-lg bg-brand-ocean text-cyan-300 flex items-center justify-center flex-shrink-0 shadow-sm text-base">${icon(iconFor(t, 'check'))}</div>
            <p class="text-sm font-bold text-slate-800 uppercase tracking-wide">${esc(t)}</p>
          </div>`).join('')}
        </div>
      </div>`;
  }

  function noIncluyeHtml(items) {
    if (!items.length) return '';
    return `
      <div class="bg-white rounded-2xl p-6 sm:p-7 shadow-soft border border-slate-200/90 fade-up">
        <div class="flex items-center justify-between pb-5 border-b border-slate-100">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center text-xl">${icon('x', 'stroke-[2.5]')}</div>
            <div>
              <h2 class="text-lg font-bold text-slate-900 tracking-tight">No incluye</h2>
              <p class="text-xs text-slate-500">Gastos opcionales por cuenta del pasajero</p>
            </div>
          </div>
          <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full">${items.length} item${items.length > 1 ? 's' : ''}</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-5">
          ${items.map(t => `
          <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50/60 border border-slate-100">
            <div class="w-7 h-7 rounded-lg bg-slate-200 text-slate-500 flex items-center justify-center flex-shrink-0 text-base">${icon(iconFor(t, 'x'))}</div>
            <p class="text-sm font-semibold text-slate-700 uppercase">${esc(t)}</p>
          </div>`).join('')}
        </div>
      </div>`;
  }

  /* ── Vuelos ──────────────────────────────────────────── */
  function escalasHtml(v) {
    if (v.escalas?.length) {
      return v.escalas.map(e => `
        <div class="bg-sky-50 border-b border-sky-100 px-6 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs text-brand-ocean">
          <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
            ${icon('git-commit-horizontal', 'text-base text-brand-cyan')}
            <span class="font-bold uppercase tracking-wider text-brand-navy">Escala: ${esc(e.destino || e.origen || '')}</span>
            <span class="text-slate-500">
              ${e.aerolinea ? `· ${esc(e.aerolinea)}${e.numero_vuelo ? ` (${esc(e.numero_vuelo)})` : ''}` : e.numero_vuelo ? `· ${esc(e.numero_vuelo)}` : ''}
              ${(e.origen || e.destino) ? `· ${esc(e.origen || '')} → ${esc(e.destino || '')}` : ''}
              ${(e.hora_salida && e.hora_llegada) ? `· ${hora(e.hora_salida)} – ${hora(e.hora_llegada)}` : ''}
            </span>
          </div>
          ${e.tiempo_conexion ? `<div class="font-semibold text-brand-ocean bg-cyan-100 px-2.5 py-0.5 rounded-full border border-cyan-200">${esc(e.tiempo_conexion)} de escala</div>` : ''}
        </div>`).join('');
    }
    if (v.tiene_escala) {
      return `
        <div class="bg-sky-50 border-b border-sky-100 px-6 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs text-brand-ocean">
          <div class="flex items-center gap-2">
            ${icon('git-commit-horizontal', 'text-base text-brand-cyan')}
            <span class="font-bold uppercase tracking-wider text-brand-navy">Escala en ${esc(v.ciudad_escala || 'ciudad no especificada')}</span>
          </div>
          ${v.tiempo_escala ? `<div class="font-semibold text-brand-ocean bg-cyan-100 px-2.5 py-0.5 rounded-full border border-cyan-200">${esc(v.tiempo_escala)} de escala</div>` : ''}
        </div>`;
    }
    return '';
  }

  function vueloHtml(v, idx) {
    const a = v.aerolinea;
    const logo = a?.logo_url || (a?.codigo_iata ? `https://www.gstatic.com/flights/airline_logos/70px/${a.codigo_iata}.png` : null);
    const iata = esc(a?.codigo_iata || (a?.nombre || '').substring(0,2).toUpperCase());
    const ida = v.tipo !== 'vuelta';
    const conexiones = v.escalas?.length || (v.tiene_escala ? 1 : 0);
    const pax = num(v.numero_pasajeros);
    const seleccionable = num(v.costo) > 0;

    return `
      <div class="flight-card bg-white rounded-2xl overflow-hidden shadow-soft border border-slate-200/90 relative transition fade-up" data-flight-idx="${idx}">
        <div class="bg-brand-navy px-6 py-4 flex flex-wrap items-center justify-between text-white gap-3 border-b border-brand-ocean/50">
          <div class="flex items-center gap-3 flex-wrap">
            <span class="text-xs font-bold uppercase tracking-wider ${ida ? 'bg-brand-cyan' : 'bg-brand-gold text-brand-navy'} px-2.5 py-1 rounded shadow-sm">${ida ? 'Vuelo de Ida' : 'Vuelo de Regreso'}</span>
            <div class="flex items-center gap-2">
              <div class="w-7 h-7 rounded bg-white flex items-center justify-center overflow-hidden border border-white/20">
                ${logo ? `<img src="${esc(logo)}" alt="${esc(a?.nombre)}" class="w-6 h-6 object-contain" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'text-[10px] font-bold text-brand-navy',textContent:'${iata}'}))">`
                       : `<span class="text-[10px] font-bold text-brand-navy">${iata || icon('plane')}</span>`}
              </div>
              <div>
                <span class="text-sm font-bold text-white tracking-wide">${esc(a?.nombre || 'Aerolínea')}</span>
                ${v.numero_vuelo ? `<span class="text-xs text-cyan-200 ml-2 font-mono">${esc(v.numero_vuelo)}</span>` : ''}
              </div>
            </div>
          </div>
          ${seleccionable
            ? `<button type="button" class="flight-toggle text-xs font-semibold px-3 py-1 rounded-full flex items-center gap-1 shadow-sm transition" data-flight-idx="${idx}"></button>`
            : `<span class="text-xs font-semibold bg-emerald-600/90 text-white px-3 py-1 rounded-full flex items-center gap-1 shadow-sm">${icon('circle-check', 'text-sm')} INCLUIDO</span>`}
        </div>
        ${escalasHtml(v)}
        <div class="p-6 sm:p-8">
          <div class="grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
            <div class="md:col-span-4 text-center md:text-left">
              <span class="text-4xl font-extrabold text-slate-900 tracking-tight">${hora(v.hora_salida)}</span>
              <div class="mt-1">
                <span class="text-sm font-bold text-brand-ocean tracking-wider">${esc(code(v.origen))}</span>
                <p class="text-xs text-slate-500 font-medium uppercase">${esc(city(v.origen))}</p>
              </div>
            </div>
            <div class="md:col-span-4 flex flex-col items-center justify-center my-2 md:my-0">
              <div class="text-[11px] font-semibold text-slate-400 mb-1 flex items-center gap-1">${icon('clock', 'text-xs text-brand-cyan')} ${conexiones ? 'Con conexión' : 'Vuelo directo'}</div>
              <div class="w-full flex items-center gap-2 relative">
                <div class="w-2.5 h-2.5 rounded-full border-2 border-brand-cyan bg-white"></div>
                <div class="h-0.5 flex-1 bg-gradient-to-r from-brand-cyan via-brand-gold to-brand-cyan relative">
                  <div class="absolute inset-0 flex items-center justify-center">
                    <span class="bg-white px-1 text-brand-ocean text-xl leading-none">${icon('plane', 'rotate-45')}</span>
                  </div>
                </div>
                <div class="w-2.5 h-2.5 rounded-full bg-brand-cyan"></div>
              </div>
              <span class="text-[10px] text-slate-400 mt-2">${conexiones ? `${conexiones} conexión${conexiones > 1 ? 'es' : ''} en ruta` : 'Sin escalas'}</span>
            </div>
            <div class="md:col-span-4 text-center md:text-right">
              <span class="text-4xl font-extrabold text-slate-900 tracking-tight">${hora(v.hora_llegada)}</span>
              <div class="mt-1">
                <span class="text-sm font-bold text-brand-ocean tracking-wider">${esc(code(v.destino))}</span>
                <p class="text-xs text-slate-500 font-medium uppercase">${esc(city(v.destino))}</p>
              </div>
            </div>
          </div>
        </div>
        <div class="relative flex items-center justify-center my-1">
          <div class="ticket-notch-left shadow-inner"></div>
          <div class="w-full border-t border-dashed border-slate-300 mx-4"></div>
          <div class="ticket-notch-right shadow-inner"></div>
        </div>
        <div class="bg-slate-50/70 p-5 px-6 sm:px-8 grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs">
          <div><span class="text-slate-400 block uppercase font-bold text-[10px] tracking-wider">Fecha salida</span><span class="font-bold text-slate-800 text-sm">${fd(v.fecha) || '—'}</span></div>
          <div><span class="text-slate-400 block uppercase font-bold text-[10px] tracking-wider">Hora salida</span><span class="font-bold text-slate-800 text-sm">${hora(v.hora_salida) || '—'}</span></div>
          <div><span class="text-slate-400 block uppercase font-bold text-[10px] tracking-wider">Hora llegada</span><span class="font-bold text-slate-800 text-sm">${hora(v.hora_llegada) || '—'}</span></div>
          <div><span class="text-slate-400 block uppercase font-bold text-[10px] tracking-wider">${pax ? 'Pasajeros' : 'Vuelo'}</span><span class="font-bold text-slate-800 text-sm">${pax ? `${pax} pasajero${pax > 1 ? 's' : ''}` : esc(v.numero_vuelo || '—')}</span></div>
        </div>
        ${seleccionable ? `<div class="px-6 sm:px-8 py-3 border-t border-slate-100 flex items-center justify-between text-xs"><span class="text-slate-400 font-semibold uppercase tracking-wider">Precio del tramo</span><span class="font-mono font-bold text-slate-900 text-sm">${COP(v.costo)}</span></div>` : ''}
      </div>`;
  }

  /* ── Hoteles ─────────────────────────────────────────── */
  function hotelHtml(h, idx, total) {
    const fotos = (h.fotos || []).filter(Boolean);
    const tags = h.que_incluye || [];
    const tienePrecioPersona = h.precio_adulto != null || h.precio_menor != null;

    return `
      <div class="hotel-card bg-white rounded-2xl overflow-hidden shadow-soft border border-slate-200/90 transition hover:border-cyan-300 fade-up" data-hotel-idx="${idx}">
        <div class="relative h-64 sm:h-80 w-full overflow-hidden bg-gradient-to-br from-brand-ocean to-brand-navy hotel-slider cursor-zoom-in" data-hotel-slider="${idx}">
          ${fotos.length
            ? fotos.map((f, i) => `<img src="${esc(f)}" alt="${esc(h.nombre)}" loading="lazy" class="hotel-slide${i === 0 ? ' active' : ''} absolute inset-0 w-full h-full object-cover" data-src="${esc(f)}">`).join('')
            : `<div class="absolute inset-0 flex items-center justify-center text-white/20 text-8xl">${icon('hotel')}</div>`}
          <div class="absolute inset-0 bg-gradient-to-t from-brand-navy/90 via-black/30 to-transparent pointer-events-none"></div>
          <div class="absolute top-4 left-4 flex flex-wrap gap-2">
            <span class="hotel-badge hidden bg-emerald-600/90 backdrop-blur text-white text-xs font-bold px-3 py-1 rounded-lg shadow-sm items-center gap-1.5">${icon('check', 'text-sm')} Seleccionado</span>
            ${h.tipo_habitacion ? `<span class="bg-brand-navy/85 backdrop-blur text-white text-xs font-medium px-3 py-1 rounded-lg border border-white/10">Habitación ${esc(h.tipo_habitacion)}</span>` : ''}
            ${total > 1 ? `<span class="bg-white/90 text-brand-navy text-xs font-bold px-3 py-1 rounded-lg">Opción ${idx + 1}</span>` : ''}
          </div>
          ${fotos.length > 1 ? `
          <div class="absolute inset-x-4 top-1/2 -translate-y-1/2 flex justify-between pointer-events-none">
            <button type="button" aria-label="Foto anterior" data-dir="prev" class="hotel-arrow w-9 h-9 rounded-full bg-brand-navy/60 hover:bg-brand-navy/90 text-white flex items-center justify-center backdrop-blur pointer-events-auto transition text-lg">${icon('chevron-left')}</button>
            <button type="button" aria-label="Foto siguiente" data-dir="next" class="hotel-arrow w-9 h-9 rounded-full bg-brand-navy/60 hover:bg-brand-navy/90 text-white flex items-center justify-center backdrop-blur pointer-events-auto transition text-lg">${icon('chevron-right')}</button>
          </div>` : ''}
          <div class="absolute bottom-4 left-4 right-4 text-white pointer-events-none">
            <h3 class="text-2xl sm:text-3xl font-bold tracking-tight text-white drop-shadow uppercase">${esc(h.nombre)}</h3>
            ${fotos.length > 1 ? `<div class="flex gap-1.5 mt-3">${fotos.map((_, i) => `<span class="hotel-dot h-1.5 rounded-full transition-all ${i === 0 ? 'w-6 bg-brand-cyan' : 'w-2 bg-white/50'}"></span>`).join('')}</div>` : ''}
          </div>
        </div>
        <div class="p-6 sm:p-7 space-y-6">
          ${tags.length ? `
          <div>
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2.5">Servicios &amp; amenidades incluidas:</span>
            <div class="flex flex-wrap gap-2">
              ${tags.map(t => /todo incluido|all inclusive/i.test(t)
                ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold bg-amber-50 text-amber-900 border border-amber-200">${icon('sparkles', 'text-sm text-brand-gold')} ${esc(t)}</span>`
                : `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-semibold bg-slate-100 text-slate-700">${icon(iconFor(t, 'check'), 'text-sm text-slate-500')} ${esc(t)}</span>`).join('')}
            </div>
          </div>` : ''}
          ${h.notas ? `
          <div class="bg-amber-50/80 border-l-4 border-brand-gold p-4 rounded-r-xl">
            <span class="text-[11px] font-extrabold uppercase tracking-wider text-amber-800 block">Notas del asesor:</span>
            <p class="text-sm font-semibold text-amber-950 mt-0.5">"${esc(h.notas)}"</p>
          </div>` : ''}
          ${(h.fecha_entrada || h.fecha_salida) ? `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 py-3 border-y border-slate-100">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-cyan-50 flex items-center justify-center text-brand-ocean text-xl">${icon('log-in')}</div>
              <div>
                <span class="text-xs text-slate-400 font-semibold block uppercase">Check-in</span>
                <span class="text-sm font-bold text-slate-900">${fd(h.fecha_entrada) || '—'}</span>
                ${h.hora_entrada ? `<span class="text-xs text-slate-500 ml-1">(Entrada: ${hora(h.hora_entrada)})</span>` : ''}
              </div>
            </div>
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-cyan-50 flex items-center justify-center text-brand-ocean text-xl">${icon('log-out')}</div>
              <div>
                <span class="text-xs text-slate-400 font-semibold block uppercase">Check-out</span>
                <span class="text-sm font-bold text-slate-900">${fd(h.fecha_salida) || '—'}</span>
                ${h.hora_salida ? `<span class="text-xs text-slate-500 ml-1">(Salida: ${hora(h.hora_salida)})</span>` : ''}
              </div>
            </div>
          </div>` : ''}
          <div class="flex flex-wrap items-end justify-between gap-4 pt-2">
            <div class="flex flex-wrap gap-x-8 gap-y-3">
              ${tienePrecioPersona ? `
              <div><span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Por adulto</span><span class="text-lg font-bold text-slate-900">${COP(h.precio_adulto)}</span></div>
              <div><span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Por menor</span><span class="text-lg font-bold text-slate-900">${COP(h.precio_menor)}</span></div>` : ''}
              <div>
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Precio paquete hotel</span>
                <span class="text-2xl font-black text-slate-900">${COP(h.precio_total)} <span class="text-xs font-medium text-slate-500">COP</span></span>
              </div>
            </div>
            <button type="button" class="hotel-toggle inline-flex items-center gap-2 px-4 py-2 rounded-xl border font-bold text-xs transition" data-hotel-idx="${idx}"></button>

        const tipo = f.tipo === 'ida' ? 'Ida' : f.tipo === 'vuelta' ? 'Vuelta' : '';
        L.push(`${tipo ? `*${tipo}:* ` : ''}${f.origen} -> ${f.destino}`);
        if (f.fecha) L.push(`  Fecha:  ${fd(f.fecha)}`);
        if (f.numero_vuelo) L.push(`  Vuelo:  ${f.numero_vuelo}`);
        if (f.escalas?.length) {
          f.escalas.forEach(e => {
            let s = `  Escala: ${e.origen || ''} → ${e.destino || ''}`;
            if (e.hora_salida && e.hora_llegada) s += ` (${e.hora_salida} – ${e.hora_llegada})`;
            if (e.tiempo_conexion) s += ` | Conexión: ${e.tiempo_conexion}`;
            if (e.aerolinea) s += ` | ${e.aerolinea}${e.numero_vuelo ? ' ' + e.numero_vuelo : ''}`;
            L.push(s);
          });
        } else if (f.tiene_escala) {
          L.push(`  Escala: ${f.ciudad_escala || ''} ${f.tiempo_escala ? `(${f.tiempo_escala})` : ''}`);
        }
        if (num(f.costo) > 0) L.push(`  Precio: ${COP(f.costo)}`);
      });
    }
    if (selH.length) {
      L.push('', '*-- ALOJAMIENTO --*');
      selH.forEach(h => {
        L.push(`*${h.nombre}*`, `  Habitacion: ${h.tipo_habitacion}`);
        if (h.notas) L.push(`  Nota: ${h.notas}`);
        if (h.fecha_entrada && h.fecha_salida) L.push(`  Fechas: ${fd(h.fecha_entrada)} al ${fd(h.fecha_salida)}`);
        if (num(h.precio_total) > 0) L.push(`  Precio: ${COP(h.precio_total)}`);
      });
    }
    if (selA.length) {
      L.push('', '*-- ADICIONALES --*');
      selA.forEach(a => L.push(`  ${a.nombre}${num(a.precio) > 0 ? `  —  ${COP(a.precio)}` : ''}`));
    }
    if (total > 0) L.push('', SEP, `*TOTAL: ${COP(total)}*`, SEP);
    return `https://wa.me/${_waNumber}?text=${encodeURIComponent(L.join('\n'))}`;
  }

  function updateSidebar() {
    const total = calcTotal();
    const txt = total > 0 ? COP(total) : 'Consultar';
    for (const id of ['ps-main-price', 'ps-total', 'mob-total']) {
      const el = document.getElementById(id); if (el) el.textContent = txt;
    }
    const hdr = document.getElementById('hdr-total'); if (hdr) hdr.textContent = total > 0 ? `${COP(total)} COP` : 'Ver total';

    const rows = [];
    const row = (titulo, sub, precio, fuerte) => `
      <div class="flex justify-between items-start gap-2">
        <div class="pr-2 min-w-0">
          <span class="${fuerte ? 'font-bold text-slate-800 uppercase' : 'font-medium text-slate-700'} block text-xs">${titulo}</span>
          ${sub ? `<span class="text-slate-400 text-[11px]">${sub}</span>` : ''}
        </div>
        <span class="${fuerte ? 'font-bold text-sm' : 'font-semibold'} text-slate-900 font-mono whitespace-nowrap">${COP(precio)}</span>
      </div>`;
    _flights.forEach((f, i) => {
      if (_selFlights.has(i) && num(f.costo) > 0) {
        const pax = num(f.numero_pasajeros);
        const sub = [pax ? `${pax} pax` : '', f.aerolinea?.nombre ? `Vuelo ${esc(f.aerolinea.nombre)}` : ''].filter(Boolean).join(', ');
        rows.push(row(`${esc(f.origen)} → ${esc(f.destino)}`, sub ? `(${sub})` : '', f.costo, true));
      }
    });
    _hotels.forEach((h, i) => {
      if (_selHotels.has(i) && num(h.precio_total) > 0) {
        const noches = (h.fecha_entrada && h.fecha_salida) ? Math.round((new Date(h.fecha_salida) - new Date(h.fecha_entrada)) / 86400000) : 0;
        rows.push(row(esc(h.nombre), `Habitación ${esc(h.tipo_habitacion || '')}${noches > 0 ? ` (${noches} noche${noches > 1 ? 's' : ''})` : ''}`, h.precio_total, true));
      }
    });
    _adicionales.forEach((a, i) => {
      if (_selAdc.has(i) && num(a.precio) > 0) rows.push(row(esc(a.nombre), '', a.precio, false));
    });
    document.getElementById('ps-breakdown').innerHTML = rows.join('');
    document.getElementById('ps-breakdown-wrap').classList.toggle('hidden', !rows.length);

    const link = buildWaLink();
    for (const id of ['btn-wa-main', 'btn-wa-mobile']) {
      const el = document.getElementById(id); if (el) el.href = link;
    }
    const help = document.getElementById('btn-wa-help'); if (help) help.href = buildWaLink(true);
  }

  function paintToggles() {
    document.querySelectorAll('.flight-toggle').forEach(btn => {
      const i = +btn.dataset.flightIdx, on = _selFlights.has(i);
      btn.className = `flight-toggle text-xs font-semibold px-3 py-1 rounded-full flex items-center gap-1 shadow-sm transition ${on ? 'bg-emerald-600/90 text-white hover:bg-emerald-700' : 'bg-white/10 text-white border border-white/30 hover:bg-white/20'}`;
      btn.innerHTML = on ? `${icon('circle-check', 'text-sm')} INCLUIDO` : `${icon('plus', 'text-sm')} INCLUIR`;
      document.querySelector(`.flight-card[data-flight-idx="${i}"]`)?.classList.toggle('flight-off', !on);
    });
    document.querySelectorAll('.hotel-toggle').forEach(btn => {
      const i = +btn.dataset.hotelIdx, on = _selHotels.has(i);
      btn.className = `hotel-toggle inline-flex items-center gap-2 px-4 py-2 rounded-xl border font-bold text-xs transition ${on ? 'bg-emerald-50 text-emerald-800 border-emerald-200 hover:bg-emerald-100' : 'bg-white text-brand-ocean border-cyan-300 hover:bg-cyan-50'}`;
      btn.innerHTML = on ? `${icon('circle-check', 'text-base text-emerald-600')} Alojamiento seleccionado` : `${icon('circle', 'text-base')} Seleccionar esta opción`;
      const card = document.querySelector(`.hotel-card[data-hotel-idx="${i}"]`);
      card?.classList.toggle('hotel-off', !on && _hotels.length > 1);
      const badge = card?.querySelector('.hotel-badge');
      badge?.classList.toggle('hidden', !on); badge?.classList.toggle('inline-flex', on);
    });
    document.querySelectorAll('.adc-toggle').forEach(btn => {
      const i = +btn.dataset.adcIdx, on = _selAdc.has(i);
      btn.className = `adc-toggle px-2 py-0.5 rounded text-[11px] font-bold uppercase tracking-wide border transition ${on ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-white text-slate-500 border-slate-300 hover:border-cyan-300'}`;
      btn.textContent = on ? '✓ Agregado' : '+ Agregar';
    });
    renderIcons();
  }

  function initSelections(d) {
    _cotData = d; _flights = d.vuelos || []; _hotels = d.opciones_hotel || []; _adicionales = d.adicionales || [];
    _selFlights = new Set(_flights.map((_, i) => i));            // todos incluidos por defecto
    _selHotels = _hotels.length ? new Set([0]) : new Set();      // primera opción por defecto
    _selAdc = new Set(_adicionales.map((_, i) => i));

    const toggle = (set, i) => { set.has(i) ? set.delete(i) : set.add(i); paintToggles(); updateSidebar(); };
    document.querySelectorAll('.flight-toggle').forEach(b => b.addEventListener('click', () => toggle(_selFlights, +b.dataset.flightIdx)));
    document.querySelectorAll('.hotel-toggle').forEach(b => b.addEventListener('click', () => toggle(_selHotels, +b.dataset.hotelIdx)));
    document.querySelectorAll('.adc-toggle').forEach(b => b.addEventListener('click', () => toggle(_selAdc, +b.dataset.adcIdx)));

    paintToggles();
    updateSidebar();
  }

  /* ── Sliders ─────────────────────────────────────────── */
  function initHeroSlider() {
    const slides = document.querySelectorAll('.hero-slide');
    const dots = document.querySelectorAll('.hero-dot');
    if (slides.length <= 1) return;
    let cur = 0, timer;
    const goTo = idx => {
      slides[cur].classList.remove('active');
      dots[cur].className = dots[cur].className.replace('w-8 bg-brand-cyan', 'w-3 bg-white/40');
      cur = (idx + slides.length) % slides.length;
      slides[cur].classList.add('active');
      dots[cur].className = dots[cur].className.replace('w-3 bg-white/40', 'w-8 bg-brand-cyan');
    };
    const start = () => { clearInterval(timer); timer = setInterval(() => goTo(cur + 1), SLIDE_DURATION); };
    dots.forEach(d => d.addEventListener('click', () => { goTo(+d.dataset.i); start(); }));
    document.getElementById('hero-prev')?.addEventListener('click', () => { goTo(cur - 1); start(); });
    document.getElementById('hero-next')?.addEventListener('click', () => { goTo(cur + 1); start(); });
    const hero = document.getElementById('hero');
    hero?.addEventListener('mouseenter', () => clearInterval(timer));
    hero?.addEventListener('mouseleave', start);
    start();
  }

  function initHotelSliders() {
    document.querySelectorAll('.hotel-slider[data-hotel-slider]').forEach(el => {
      const slides = el.querySelectorAll('.hotel-slide');
      const dots = el.querySelectorAll('.hotel-dot');
      if (!slides.length) return;
      let cur = 0, timer;
      const goTo = idx => {
        slides[cur].classList.remove('active');
        if (dots[cur]) dots[cur].className = dots[cur].className.replace('w-6 bg-brand-cyan', 'w-2 bg-white/50');
        cur = (idx + slides.length) % slides.length;
        slides[cur].classList.add('active');
        if (dots[cur]) dots[cur].className = dots[cur].className.replace('w-2 bg-white/50', 'w-6 bg-brand-cyan');
      };
      const start = () => { clearInterval(timer); if (slides.length > 1) timer = setInterval(() => goTo(cur + 1), 3500); };
      el.querySelectorAll('.hotel-arrow').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); goTo(cur + (b.dataset.dir === 'prev' ? -1 : 1)); start(); }));
      el.addEventListener('mouseenter', () => clearInterval(timer));
      el.addEventListener('mouseleave', start);
      el.addEventListener('click', e => {
        if (e.target.closest('.hotel-arrow')) return;
        const src = slides[cur]?.dataset.src; if (src) openLightbox(src);
      });
      start();
    });
  }

  /* ── Lightbox ────────────────────────────────────────── */
  const lb = document.getElementById('lightbox');
  function openLightbox(src) { document.getElementById('lightbox-img').src = src; lb.classList.add('show'); }
  const closeLightbox = () => lb.classList.remove('show');
  lb.addEventListener('click', e => { if (e.target === lb) closeLightbox(); });
  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  load();
</script>
